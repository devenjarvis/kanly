name: mutation-test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  cauldron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cauldron
        run: go build -o cauldron ./cmd/cauldron

      - name: Run cauldron on ./internal/report
        id: run
        continue-on-error: true
        run: ./cauldron --format=text ./internal/report 2>&1 | tee cauldron-report.txt

      - name: Build comment body
        run: |
          {
            echo "<!-- cauldron-report -->"
            echo "### 🧪 Cauldron mutation report — ./internal/report"
            echo ""
            echo '```text'
            cat cauldron-report.txt
            echo '```'
          } > comment.md

      - name: Find existing comment
        id: fc
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- cauldron-report -->'

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md
          edit-mode: replace
